name: Deploy k8s

on:
  push:
    branches: [week*]

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bp.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build and push backend
        id: bp
        run: |
          IMAGE=${{ secrets.DOCKER_USER }}/todo-back:sha-${{ github.sha }}
          docker build --platform linux/amd64 -t $IMAGE -t ${{ secrets.DOCKER_USER }}/todo-back:latest back
          docker push $IMAGE
          docker push ${{ secrets.DOCKER_USER }}/todo-back:latest
          echo "version=sha-${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to k3s
        env:
          IMAGE: ${{ secrets.DOCKER_USER }}/todo-back:${{ needs.build.outputs.version }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          envsubst < k8s/backend.yaml | kubectl apply -f -
          kubectl rollout status deployment/backend --timeout=120s

  notify:
    needs: [checks, build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        run: |
          CHECKS="${{ needs.checks.result }}"
          BUILD="${{ needs.build.result }}"
          DEPLOY="${{ needs.deploy.result }}"

          if [ "$CHECKS" != "success" ]; then
            TEXT="❌ Type-check упал%0A${{ github.repository }} @ ${{ github.ref_name }}%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ "$BUILD" != "success" ]; then
            TEXT="❌ Build упал%0A${{ github.repository }} @ ${{ github.ref_name }}%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ "$DEPLOY" != "success" ]; then
            TEXT="❌ Deploy упал%0A${{ github.repository }} @ ${{ github.ref_name }}%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            TEXT="✅ k8s деплой успешен%0A${{ github.repository }} @ ${{ github.ref_name }}%0AActor: ${{ github.actor }}%0AVersion: sha-${{ github.sha }}"
          fi

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "disable_web_page_preview=true")

          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || { echo "Telegram API rejected"; exit 1; }
