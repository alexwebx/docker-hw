services:
  db:
    image: postgres:16-alpine
    env_file: .env.development.db
    ports:
      - "15432:5432"
    healthcheck:
      test: [ "CMD-SHELL",  "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  back:
    image: ${DOCKERHUB_USERNAME}/todo-back:${IMAGE_TAG}
    platform: linux/amd64
    env_file: .env.development.back
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "13000:3000"
    volumes:
      - ./app-config:/app/config:ro

  front:
    image: ${DOCKERHUB_USERNAME}/todo-front:${IMAGE_TAG}
    platform: linux/amd64
    ports:
      - "18080:80"
    depends_on:
      back:
        condition: service_started
volumes:
  pgdata:
